capability = "calc.definite-integral"
source = "https://svenska-content.ylestatic.fi/abimix/2024/var/N_sv/ — 2024, uppgift 1.2"
document = '\int_{0}^{2} 3x^2 dx'
expect.exact = "8"
note = "∫₀² 3x² dx = 8. Needs W3.1; the field refuses the integral with `\\int has no expression form` until then, so the row fails rather than claiming coverage."
