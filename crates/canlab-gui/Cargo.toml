[package]
name = "canlab-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Abitti-style GUI: palette, LaTeX input, typeset output, plot"

[[bin]]
name = "canlab-gui"
path = "src/main.rs"

[dependencies]
canlab-core = { path = "../canlab-core" }
canlab-input = { path = "../canlab-input" }
canlab-mathview = { path = "../canlab-mathview" }
canlab-parse = { path = "../canlab-parse" }
canlab-tex = { path = "../canlab-tex" }
canlab-plot = { path = "../canlab-plot" }
canlab-solver = { path = "../canlab-solver" }
# The default (wgpu) backend is the one that ships. `--features glow` switches to
# the GL renderer, whose framebuffer *can* be read back — which is how the
# screenshot hook in `shot.rs` works on a machine where `PrintWindow` sees a
# blank surface over a remote session.
eframe = "0.37.0"

[features]
default = []
glow = ["eframe/glow"]
