[package]
name = "canlab-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Abitti-style GUI: palette, LaTeX input, typeset output, plot"

[[bin]]
name = "canlab-gui"
path = "src/main.rs"

[dependencies]
canlab-core = { path = "../canlab-core" }
canlab-input = { path = "../canlab-input" }
canlab-mathview = { path = "../canlab-mathview" }
canlab-parse = { path = "../canlab-parse" }
canlab-tex = { path = "../canlab-tex" }
canlab-plot = { path = "../canlab-plot" }
canlab-scene = { path = "../canlab-scene" }
canlab-ode = { path = "../canlab-ode" }
canlab-solver = { path = "../canlab-solver" }
canlab-muon = { path = "../canlab-muon" }
canlab-optics = { path = "../canlab-optics" }
# Bevy owns the window, the event loop and (from M5) the 3D view; egui is the
# interface inside it. `eframe` is gone on purpose: it cannot host a Bevy render
# graph, and two window/event loops in one process is a fight, not a design.
bevy = "0.20.1"
bevy_egui = "0.43.1"
egui = "0.36.0"

[features]
default = []
# Note for later: `bevy/dynamic_linking` is Bevy's most effective compile-time
# change, and it does not work here yet — Windows fails to link `bevy_dylib`
# with LNK1189 ("too many exported symbols") unless the performance profiles are
# also set, and every test binary then needs the dylib on `PATH`. Revisit with
# `[profile.dev] opt-level = 1` and `[profile.dev.package."*"] opt-level = 3`.

[dev-dependencies]
# A headless frame: `egui_kittest` renders into an offscreen texture through
# `wgpu`, so a snapshot test needs no window and no desktop. That is the whole
# reason it is here — see `src/snapshot.rs`.
egui_kittest = { version = "0.36.0", features = ["wgpu", "snapshot"] }
